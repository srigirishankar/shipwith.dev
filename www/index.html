<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Interactive architecture simulator for web apps. See how your tech choices affect what matters.">
    <meta name="author" content="Shankar">

    <meta property="og:title" content="shipwith.dev - Architecture Simulator">
    <meta property="og:description" content="See how your tech choices affect what matters.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://shipwith.dev">

    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="shipwith.dev">
    <meta name="twitter:description" content="Interactive architecture simulator for web apps.">

    <title>shipwith.dev - Architecture Simulator</title>

    <link rel="stylesheet" href="/style.css">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
    <div id="metrics-bar">
        <div class="metric">
            <span class="label">Monthly Cost</span>
            <span class="value" id="metric-cost">$0</span>
        </div>
        <div class="metric">
            <span class="label">Latency</span>
            <span class="value" id="metric-latency">12ms</span>
        </div>
        <div class="metric">
            <span class="label">Uptime</span>
            <span class="value" id="metric-uptime">99.99%</span>
        </div>
        <div class="metric">
            <span class="label">Edge Locations</span>
            <span class="value" id="metric-locations">300+</span>
        </div>
    </div>

    <canvas id="scene"></canvas>

    <div id="info-panel" class="hidden">
        <button id="close-panel" aria-label="Close panel">&times;</button>
        <h2 id="panel-title"></h2>
        <p id="panel-description"></p>
        <div id="panel-reasons">
            <h3>Why This Choice</h3>
            <ul id="panel-reasons-list"></ul>
        </div>
        <div id="panel-code">
            <pre><code id="panel-code-content"></code></pre>
        </div>
        <div id="panel-links">
            <a id="panel-docs-link" href="#" target="_blank" rel="noopener">Docs</a>
        </div>
    </div>

    <div id="controls">
        <button id="btn-deconstruct" class="primary">How It Works</button>
        <button id="btn-reconstruct" class="hidden">Reconstruct</button>
    </div>

    <script type="module">
        import init, { App } from './pkg/shipwith_dev.js';

        async function main() {
            await init();
            const app = new App();
            app.start();
        }

        main().catch(console.error);
    </script>
</body>
</html>
