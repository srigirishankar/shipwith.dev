<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1d1d1d"/>
      <stop offset="100%" style="stop-color:#2a2a2a"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Accent line -->
  <rect x="0" y="0" width="1200" height="6" fill="#F6821F"/>

  <!-- Main title -->
  <text x="100" y="200" font-family="Inter, -apple-system, sans-serif" font-size="72" font-weight="700" fill="#ffffff">shipwith.dev</text>

  <!-- Subtitle -->
  <text x="100" y="280" font-family="Inter, -apple-system, sans-serif" font-size="36" fill="#F6821F">Architecture Simulator</text>

  <!-- Description -->
  <text x="100" y="360" font-family="Inter, -apple-system, sans-serif" font-size="28" fill="#a0a0a0">See how your tech choices affect what matters:</text>
  <text x="100" y="400" font-family="Inter, -apple-system, sans-serif" font-size="28" fill="#a0a0a0">cost, latency, uptime.</text>

  <!-- Provider boxes -->
  <rect x="100" y="480" width="200" height="80" rx="12" fill="#F6821F"/>
  <text x="200" y="530" font-family="Inter, sans-serif" font-size="24" font-weight="600" fill="#ffffff" text-anchor="middle">Cloudflare</text>

  <rect x="340" y="480" width="200" height="80" rx="12" fill="#4285F4"/>
  <text x="440" y="530" font-family="Inter, sans-serif" font-size="24" font-weight="600" fill="#ffffff" text-anchor="middle">GCP</text>

  <rect x="580" y="480" width="200" height="80" rx="12" fill="#FF9900"/>
  <text x="680" y="530" font-family="Inter, sans-serif" font-size="24" font-weight="600" fill="#ffffff" text-anchor="middle">AWS</text>

  <rect x="820" y="480" width="200" height="80" rx="12" fill="#0078D4"/>
  <text x="920" y="530" font-family="Inter, sans-serif" font-size="24" font-weight="600" fill="#ffffff" text-anchor="middle">Azure</text>

  <!-- 3D hint icon -->
  <g transform="translate(1000, 150)">
    <rect x="0" y="0" width="120" height="120" rx="16" fill="rgba(255,255,255,0.1)" stroke="rgba(255,255,255,0.2)" stroke-width="2"/>
    <text x="60" y="70" font-family="Inter, sans-serif" font-size="48" fill="#ffffff" text-anchor="middle">3D</text>
  </g>
</svg>
